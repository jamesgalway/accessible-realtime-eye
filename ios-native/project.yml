name: AccessibleVision
options:
  bundleIdPrefix: com.zzypiano
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: AccessibleVision
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GREEN_CLOUD_BASE_URL: "https://gemini-eye.zzypiano401402.xyz"
    ALIYUN_BASE_URL: "https://47.94.130.89.sslip.io:8443"
targets:
  AccessibleVision:
    type: application
    platform: iOS
    sources:
      - path: AccessibleVision
    info:
      path: AccessibleVision/Info.plist
      properties:
        CFBundleDisplayName: "实时慧眼"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "实时慧眼需要使用后置摄像头识别环境和寻找物品。"
        NSMicrophoneUsageDescription: "实时慧眼需要使用麦克风接收你的任务和问题。"
        NSLocationWhenInUseUsageDescription: "实时慧眼只在导航期间使用你的位置，用于路线跟随、转弯提醒和偏航判断。"
        GreenCloudBaseURL: "$(GREEN_CLOUD_BASE_URL)"
        AliyunBaseURL: "$(ALIYUN_BASE_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzypiano.accessiblevision.dev
        TARGETED_DEVICE_FAMILY: "1"
  AccessibleVisionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AccessibleVisionTests
    dependencies:
      - target: AccessibleVision
