name: Build Private iPhone Local Screening Experiment

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      run_runtime_checks:
        description: "Run runtime regression checks; disable for an explicitly requested self-test build"
        type: boolean
        default: true
      verify_native_connection:
        description: "Explicitly run the bounded native Ali network probe"
        type: boolean
        default: false
      verify_native_interface:
        description: "Run the optional simulator UI check (known app-launch timeout)"
        type: boolean
        default: false
      verify_js_core:
        description: "Run the optional existing JavaScriptCore probe (known timeout)"
        type: boolean
        default: false
  push:
    branches:
      - ios-native-minicpm35b-lab-20261021
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-unsigned-ipa.yml"
      - ".github/scripts/**"

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HUIYAN_UI_SIM_RUNTIME: iOS-18-5
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore pinned native model runtime
        uses: actions/cache@v4
        with:
          path: ios-native/LocalScreeningFramework/llama.xcframework
          key: minicpm35b-fa9d837-96bbf61-xcode16.4-device-v1

      - name: Build pinned local vision runtime without model weights
        run: bash .github/scripts/build-local-screen35b.sh

      - name: Save compiled native runtime
        uses: actions/cache/save@v4
        with:
          path: ios-native/LocalScreeningFramework/llama.xcframework
          key: minicpm35b-fa9d837-96bbf61-xcode16.4-device-v1

      - name: Build isolated screen runtime
        working-directory: ios-native/ScreenShareBuild
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node build.cjs

      - name: Verify native entry bridge and lifecycle
        if: github.event_name != 'workflow_dispatch' || inputs.run_runtime_checks
        run: |
          node ios-native/Tests/NativeAssistantEntryHarness.cjs
          node ios-native/Tests/AppLaunchLifecycleHarness.js
          node ios-native/Tests/ScreenShareRuntimeHarness.cjs
          node ios-native/Tests/LocalScreenReminderHarness.cjs
          clang++ -std=c++17 ios-native/Tests/LocalVisionFailureHarness.cpp -o "$RUNNER_TEMP/local-vision-failure-test"
          "$RUNNER_TEMP/local-vision-failure-test"

      - name: Verify native JavaScriptCore compatibility
        # Unmodified build71 screen runtime: the existing macOS smoke reports
        # "did not complete: undefined". Keep it explicitly available without
        # making this isolated native model experiment depend on that old probe.
        if: github.event_name == 'workflow_dispatch' && inputs.verify_js_core
        run: swift ios-native/Tests/ScreenShareJSCoreSmoke.swift ios-native

      - name: Verify native screen WebSocket enrollment
        if: github.event_name != 'workflow_dispatch' || inputs.run_runtime_checks
        run: |
          swiftc ios-native/AccessibleVision/ScreenShare/ScreenShareWebSocketRequest.swift ios-native/Tests/ScreenShareCookie/main.swift -o "$RUNNER_TEMP/huiyan-screen-cookie-check"
          "$RUNNER_TEMP/huiyan-screen-cookie-check"

      - name: Add private native authorization resource
        env:
          HUIYAN_NATIVE_ACCESS_BOOTSTRAP: ${{ secrets.HUIYAN_NATIVE_ACCESS_BOOTSTRAP }}
        run: node .github/scripts/write-native-access.cjs

      - name: Probe native Ali enrollment and WebSocket without generated response
        if: github.event_name == 'workflow_dispatch' && inputs.verify_native_connection
        run: |
          app="$RUNNER_TEMP/ScreenNetworkProbe.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp ios-native/Tests/ScreenShareNetworkProbe/Info.plist "$app/Contents/Info.plist"
          cp ios-native/AccessibleVision/NativeAccessCredentials.json "$app/Contents/Resources/"
          swiftc -swift-version 5 ios-native/AccessibleVision/Services/NativeAccessEnrollment.swift ios-native/AccessibleVision/ScreenShare/ScreenShareWebSocketRequest.swift ios-native/Tests/ScreenShareNetworkProbe/main.swift -o "$app/Contents/MacOS/ScreenNetworkProbe"
          "$app/Contents/MacOS/ScreenNetworkProbe"
          rm -rf "$app"

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ios-native
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project AccessibleVision.xcodeproj \
            -scheme AccessibleVision \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|BUILD FAILED|The following build commands failed" xcodebuild.log \
              | tail -80 \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
            exit "$status"
          fi

      - name: Package unsigned IPA
        working-directory: ios-native
        run: |
          set -euo pipefail
          app="build/Build/Products/Debug-iphoneos/AccessibleVision.app"
          test -d "$app"
          rm -rf Payload AccessibleVision-unsigned.ipa
          mkdir Payload
          cp -R "$app" Payload/
          /usr/bin/zip -qry AccessibleVision-unsigned.ipa Payload

      - name: Encrypt private IPA
        env:
          HUIYAN_NATIVE_IPA_ENCRYPTION_KEY: ${{ secrets.HUIYAN_NATIVE_IPA_ENCRYPTION_KEY }}
        run: node .github/scripts/encrypt-native-ipa.cjs ios-native/AccessibleVision-unsigned.ipa ios-native/AccessibleVision-private.ipa.enc

      - name: Upload encrypted IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleVision-private-ipa-encrypted
          path: ios-native/AccessibleVision-private.ipa.enc
          if-no-files-found: error
          retention-days: 7

      - name: Verify native entries in iPhone simulator accessibility tree
        if: github.event_name == 'workflow_dispatch' && inputs.verify_native_interface
        run: python3 ios-native/Tests/run-native-entry-accessibility.py

      - name: Preserve simulator failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-entry-simulator-log
          path: ios-native/entry-accessibility-test.log
          if-no-files-found: ignore
          retention-days: 7
