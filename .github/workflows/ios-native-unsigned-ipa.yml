name: Build Private iPhone Screen Sharing IPA

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      verify_native_connection:
        description: "Explicitly run the bounded native Ali network probe"
        type: boolean
        default: false
  push:
    branches:
      - ios-native-screen-share-20261018
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-unsigned-ipa.yml"
      - ".github/scripts/**"

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HUIYAN_UI_SIM_RUNTIME: iOS-18-5
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build isolated screen runtime
        working-directory: ios-native/ScreenShareBuild
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node build.cjs

      - name: Verify native entry bridge and lifecycle
        run: |
          node ios-native/Tests/NativeAssistantEntryHarness.cjs
          node ios-native/Tests/AppLaunchLifecycleHarness.js

      - name: Verify native JavaScriptCore compatibility
        run: swift ios-native/Tests/ScreenShareJSCoreSmoke.swift ios-native

      - name: Verify native screen WebSocket enrollment
        run: |
          swiftc ios-native/AccessibleVision/ScreenShare/ScreenShareWebSocketRequest.swift ios-native/Tests/ScreenShareCookie/main.swift -o "$RUNNER_TEMP/huiyan-screen-cookie-check"
          "$RUNNER_TEMP/huiyan-screen-cookie-check"

      - name: Add private native authorization resource
        env:
          HUIYAN_NATIVE_ACCESS_BOOTSTRAP: ${{ secrets.HUIYAN_NATIVE_ACCESS_BOOTSTRAP }}
        run: node .github/scripts/write-native-access.cjs

      - name: Probe native Ali enrollment and WebSocket without generated response
        if: github.event_name == 'workflow_dispatch' && inputs.verify_native_connection
        run: |
          app="$RUNNER_TEMP/ScreenNetworkProbe.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp ios-native/Tests/ScreenShareNetworkProbe/Info.plist "$app/Contents/Info.plist"
          cp ios-native/AccessibleVision/NativeAccessCredentials.json "$app/Contents/Resources/"
          swiftc -swift-version 5 ios-native/AccessibleVision/Services/NativeAccessEnrollment.swift ios-native/AccessibleVision/ScreenShare/ScreenShareWebSocketRequest.swift ios-native/Tests/ScreenShareNetworkProbe/main.swift -o "$app/Contents/MacOS/ScreenNetworkProbe"
          "$app/Contents/MacOS/ScreenNetworkProbe"
          rm -rf "$app"

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ios-native
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project AccessibleVision.xcodeproj \
            -scheme AccessibleVision \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|BUILD FAILED|The following build commands failed" xcodebuild.log \
              | tail -80 \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
            exit "$status"
          fi

      - name: Verify native entries in iPhone simulator accessibility tree
        run: python3 ios-native/Tests/run-native-entry-accessibility.py

      - name: Package unsigned IPA
        working-directory: ios-native
        run: |
          set -euo pipefail
          app="build/Build/Products/Debug-iphoneos/AccessibleVision.app"
          test -d "$app"
          rm -rf Payload AccessibleVision-unsigned.ipa
          mkdir Payload
          cp -R "$app" Payload/
          /usr/bin/zip -qry AccessibleVision-unsigned.ipa Payload

      - name: Encrypt private IPA
        env:
          HUIYAN_NATIVE_IPA_ENCRYPTION_KEY: ${{ secrets.HUIYAN_NATIVE_IPA_ENCRYPTION_KEY }}
        run: node .github/scripts/encrypt-native-ipa.cjs ios-native/AccessibleVision-unsigned.ipa ios-native/AccessibleVision-private.ipa.enc

      - name: Upload encrypted IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleVision-private-ipa-encrypted
          path: ios-native/AccessibleVision-private.ipa.enc
          if-no-files-found: error
          retention-days: 7
