name: Build iPhone Test IPA

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - ios-native-hardware-foundation
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ios-native
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project AccessibleVision.xcodeproj \
            -scheme AccessibleVision \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error:|BUILD FAILED|The following build commands failed" xcodebuild.log \
              | tail -80 \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
            exit "$status"
          fi

      - name: Package unsigned IPA
        working-directory: ios-native
        run: |
          set -euo pipefail
          app="build/Build/Products/Debug-iphoneos/AccessibleVision.app"
          test -d "$app"
          rm -rf Payload AccessibleVision-unsigned.ipa
          mkdir Payload
          cp -R "$app" Payload/
          /usr/bin/zip -qry AccessibleVision-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleVision-unsigned-ipa
          path: ios-native/AccessibleVision-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Publish temporary unsigned IPA
        working-directory: ios-native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-native-test-${GITHUB_RUN_NUMBER}" \
            AccessibleVision-unsigned.ipa \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "iPhone native hardware test ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned hardware test build. It must be signed for the test device before installation."
