name: Build iPhone Test IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-native-hardware-foundation
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ios-native
        run: |
          set -euo pipefail
          xcodebuild \
            -project AccessibleVision.xcodeproj \
            -scheme AccessibleVision \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios-native
        run: |
          set -euo pipefail
          app="build/Build/Products/Debug-iphoneos/实时慧眼.app"
          test -d "$app"
          rm -rf Payload AccessibleVision-unsigned.ipa
          mkdir Payload
          cp -R "$app" Payload/
          /usr/bin/zip -qry AccessibleVision-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleVision-unsigned-ipa
          path: ios-native/AccessibleVision-unsigned.ipa
          if-no-files-found: error
          retention-days: 7